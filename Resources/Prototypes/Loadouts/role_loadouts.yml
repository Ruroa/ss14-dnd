# SS14 DND campaign loadout cutdown
#
# Existing item and loadout prototypes are intentionally kept in the repository.
# This file only controls which groups are exposed to role loadout customization.
# The Assistant job is displayed as Contractor in SS14 DND and is the only lobby-facing role for now.

- type: roleLoadout
  id: JobAssistant
  groups:
  - AssistantJumpsuit
  - AssistantBackpack
  - AssistantNeck
  - AssistantOuterClothing
  - AssistantShoes
  - AssistantGlasses
  - AssistantHead
  - Scarves
  - Pins
  - Pens
  - GroupSpeciesBreathTool
